<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c6b63" />

    <!-- Modern browsers pick the SVG; older ones fall back to the .ico. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Inter for UI (tabular figures cover chart data); Geist Mono only
         for dental-code strings. Robust system fallbacks in themes.css
         keep the app usable if the font CDN is unreachable in-clinic. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
    />

    <!-- ===== SEO ===== -->
    <title>ToothOps — Veterinary Dental Charting Software (Voice, Radiographs, PDFs)</title>
    <meta
      name="description"
      content="ToothOps is chairside veterinary dental charting for dogs and cats: full-mouth Triadan grids, AVDC nomenclature, voice autofill, intraoral photos and radiographs, per-patient history, recall reminders, team access, and client-ready branded PDFs. Free to try — no account needed."
    />
    <meta name="keywords" content="veterinary dental charting, vet dental software, dental chart, Triadan chart, AVDC nomenclature, canine dental chart, feline dental chart, veterinary dentistry software, periodontal charting, dental radiographs, animal dental records" />
    <meta name="author" content="ToothOps" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://toothops.app/" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, Slack…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ToothOps" />
    <meta property="og:title" content="ToothOps — Veterinary Dental Charting" />
    <meta
      property="og:description"
      content="Chart the procedure; the paperwork does itself. Triadan grids, AVDC codes, voice autofill, radiographs, and client-ready PDFs for dog and cat dentistry."
    />
    <meta property="og:url" content="https://toothops.app/" />
    <meta property="og:image" content="https://toothops.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ToothOps — veterinary dental charting" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ToothOps — Veterinary Dental Charting" />
    <meta
      name="twitter:description"
      content="Chairside dental charting for vets: Triadan grids, AVDC codes, voice autofill, radiographs, and branded PDFs."
    />
    <meta name="twitter:image" content="https://toothops.app/og-image.png" />

    <!-- Structured data: helps Google show the product richly. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ToothOps",
        "applicationCategory": "HealthApplication",
        "applicationSubCategory": "Veterinary dental charting",
        "operatingSystem": "Web",
        "url": "https://toothops.app/",
        "image": "https://toothops.app/og-image.png",
        "description": "Chairside veterinary dental charting for dogs and cats: full-mouth Triadan grids, AVDC nomenclature, voice autofill, intraoral photos and radiographs, per-patient history, recall reminders, team access, and client-ready branded PDFs.",
        "offers": {
          "@type": "AggregateOffer",
          "priceCurrency": "USD",
          "lowPrice": "20",
          "highPrice": "120",
          "offerCount": "4",
          "offers": [
            { "@type": "Offer", "name": "Individual", "price": "20", "priceCurrency": "USD", "description": "Solo practitioner, monthly. 14-day free trial." },
            { "@type": "Offer", "name": "Individual Pro", "price": "40", "priceCurrency": "USD", "description": "Solo with AI voice autofill, monthly. 14-day free trial." },
            { "@type": "Offer", "name": "Practice", "price": "60", "priceCurrency": "USD", "description": "Up to 5 team members, monthly. 14-day free trial." },
            { "@type": "Offer", "name": "Practice Pro", "price": "120", "priceCurrency": "USD", "description": "Up to 5 team members with AI voice autofill, monthly. 14-day free trial." }
          ]
        },
        "featureList": [
          "Full-mouth Triadan dental charts (feline, canine, deciduous)",
          "AVDC nomenclature and abbreviations",
          "Voice dictation with AI autofill",
          "Intraoral photo and radiograph attachments",
          "Per-patient visit history and recall reminders",
          "Multi-doctor team access",
          "Client-ready branded PDF export"
        ]
      }
    </script>
