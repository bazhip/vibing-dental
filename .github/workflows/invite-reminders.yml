# Daily: remind team invitees who haven't activated their account
# (supabase/functions/invite-reminders — at most 2 reminders, at 24h and
# 5 days; team invites still pending 14 days after the final reminder are
# deleted, as that email warns). The function is protected by a shared secret: set
# INVITE_CRON_SECRET here (repo Settings → Secrets → Actions) and the
# same value as CRON_SECRET in Supabase (supabase secrets set ...).
name: Invite reminders

on:
  schedule:
    - cron: '0 16 * * *' # 16:00 UTC ≈ 8–9 am US Pacific, start of the workday
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send due invite reminders
        env:
          CRON_SECRET: ${{ secrets.INVITE_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "INVITE_CRON_SECRET is not set"; exit 1; fi
          resp=$(curl -sS -w '\n%{http_code}' -X POST \
            'https://ocjnngfzwyajhgqzicsf.supabase.co/functions/v1/invite-reminders' \
            -H "x-cron-secret: $CRON_SECRET" -H 'Content-Type: application/json' -d '{}')
          code=$(echo "$resp" | tail -n1)
          echo "$resp" | head -n -1
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
