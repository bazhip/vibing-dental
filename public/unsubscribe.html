<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ToothOps</title>
<style>
  body{margin:0;background:#f4f6f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#17232e}
  main{max-width:440px;margin:12vh auto 0;padding:0 16px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:28px 32px}
  .brand{font-size:20px;font-weight:700;color:#0c6b63;margin:0 0 12px}
  h1{font-size:20px;margin:0 0 12px}
  p{line-height:1.55;margin:0 0 16px}
  button{min-height:44px;padding:0 22px;border:0;border-radius:8px;background:#0c6b63;color:#fff;font-family:inherit;font-weight:600;font-size:16px;cursor:pointer}
  button[disabled]{opacity:.6;cursor:default}
  a{color:#0c6b63}
</style>
</head>
<body>
<main>
  <div class="card">
    <p class="brand">ToothOps</p>
    <h1 id="title"></h1>
    <p id="body"></p>
    <button id="go" type="button"></button>
    <p id="msg" role="status" style="margin:16px 0 0"></p>
  </div>
</main>
<script src="/unsubscribe.js"></script>
</body>
</html>
